name: Terraform CI/CD

on:
  push:
    branches: [main, develop]
    paths: ["environments/**", "modules/**"]
  pull_request:
    branches: [main]
    paths: ["environments/**", "modules/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para deploy"
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        description: "Ação"
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write       # necessário para OIDC com AWS
  pull-requests: write  # para comentar o plan no PR

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"

jobs:
  # ── Validação e segurança (roda em todo PR e push) ─────────────────────────
  validate:
    name: Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec . --minimum-severity HIGH --format lovely
        continue-on-error: false

      - name: Install checkov
        run: pip install checkov --quiet

      - name: Run checkov
        run: checkov -d . --framework terraform --quiet --compact
        continue-on-error: true  # warning, não bloqueia (ajuste conforme maturidade)

      - name: Check for hardcoded credentials
        run: |
          if grep -rn --include="*.tf" -E "(AKIA[0-9A-Z]{16}|password\s*=\s*\"[^${\"][^\"]{7,}\")" . | grep -v "#"; then
            echo "❌ Credenciais hardcoded detectadas!"
            exit 1
          fi
          echo "✅ Nenhuma credencial hardcoded."

  # ── Plan para dev (push em develop) ──────────────────────────────────────
  plan-dev:
    name: Plan — dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-dev-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: environments/dev
        run: |
          terraform plan -input=false -no-color \
            -var-file="terraform.tfvars" \
            -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...[truncado]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — dev\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: environments/dev/tfplan
          retention-days: 1

  # ── Apply dev (apenas em push para develop com aprovação manual) ──────────
  apply-dev:
    name: Apply — dev
    runs-on: ubuntu-latest
    needs: plan-dev
    if: |
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'dev' &&
       github.event.inputs.action == 'apply')
    environment:
      name: dev
      # Requer aprovação manual configurada em Settings > Environments > dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-apply-dev-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: environments/dev

      - name: Terraform Apply
        working-directory: environments/dev
        run: terraform apply -input=false -auto-approve tfplan

  # ── Plan + Apply staging (push em main após PR aprovado) ─────────────────
  plan-staging:
    name: Plan — staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-staging-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: environments/staging
        run: |
          terraform plan -input=false -no-color \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: environments/staging/tfplan
          retention-days: 1

  apply-staging:
    name: Apply — staging
    runs-on: ubuntu-latest
    needs: plan-staging
    environment:
      name: staging
      # Requer aprovação manual em Settings > Environments > staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-apply-staging-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: environments/staging

      - name: Terraform Apply
        working-directory: environments/staging
        run: terraform apply -input=false -auto-approve tfplan

  # ── Prod: plan + aprovação obrigatória antes de apply ────────────────────
  plan-prod:
    name: Plan — prod
    runs-on: ubuntu-latest
    needs: apply-staging
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-prod-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: environments/prod
        run: |
          terraform plan -input=false -no-color \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: environments/prod/tfplan
          retention-days: 1

  apply-prod:
    name: Apply — prod
    runs-on: ubuntu-latest
    needs: plan-prod
    environment:
      name: prod
      # ⚠️ OBRIGATÓRIO: aprovação manual de 2 reviewers configurada em:
      # Settings > Environments > prod > Required reviewers

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-apply-prod-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: environments/prod

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -input=false -auto-approve tfplan

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deploy em produção concluído — run ${{ github.run_id }}"
          # Adicione aqui notificação Slack/Teams/PagerDuty se necessário
